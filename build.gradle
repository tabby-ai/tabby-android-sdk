// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        compile_sdk_version = 37
        min_sdk_version     = 23
        demoapp_min_sdk_version = 24
        target_sdk_version  = 37

        agp_version     = '9.4.0'
        kotlin_version  = '2.4.20'

        corektx_version         = '1.19.0'
        appcompat_version       = '1.8.0'
        material_version        = '1.14.0'
        compose_bom_version     = '2026.09.00'
        lifecycle_version       = '2.11.0'
        lint_version            = '32.4.0'
        activity_compose_verion = '1.13.0'
        kotlin_serialization_version = '1.11.0'

        coroutines_version  = '1.11.0'
        retrofit_version    = '3.0.0'
        okhttp_version      = '5.5.0'

        navigation_compose_version = '2.10.1'

        junit_version           = '4.13.2'
        androidx_junit_version  = '1.3.0'
        espresso_version        = '3.7.0'

        nexus_publish_plugin    = '2.0.0'

        tabby_sdk_version   = '3.0.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id("io.github.gradle-nexus.publish-plugin") version "$nexus_publish_plugin"
    id("org.jetbrains.kotlin.plugin.serialization") version "$kotlin_version" apply(false)
    id("org.jetbrains.kotlin.plugin.compose") version "$kotlin_version" apply(false)
}

apply from: "${rootDir}/scripts/publish-root.gradle"

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
